<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MySiri–2K26</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
    <h2>Mysore College of Engineering and Management</h2>
    <h1>🎉 MySiri–2K26</h1>

    <div id="header-timer" class="header-timer"></div>

    <button onclick="scrollToSection()">🚀 Explore Events</button>
</header>

<section id="events">
    <h2>📅 Event Schedule</h2>

    <div class="cards">
        <div class="card">
            <h3>April 15</h3>
            <p>🎨 Colour Day</p>
            <span>Funky / Western</span>
        </div>

        <div class="card">
            <h3>April 16</h3>
            <p>👗 Ethnic Day</p>
        </div>

        <div class="card">
            <h3>April 17</h3>
            <p>🎉 Cultural Fest - Day 1</p>
        </div>

        <div class="card">
            <h3>April 18</h3>
            <p>🎊 Cultural Fest - Day 2</p>
            <span>Lunch 🍽️</span>
        </div>
    </div>
</section>

<section class="highlight">
    🍽️ Lunch on April 18 from 12:30 PM in Cafeteria
</section>

<!-- POPUP -->
<div id="popup" class="popup">
    <div class="popup-content">
        <span class="close" onclick="closePopup()">&times;</span>
        <p id="popup-text"></p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
